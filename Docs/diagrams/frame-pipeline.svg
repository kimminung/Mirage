<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3ff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="48" y="56" fill="#ffffff" font-size="28" font-weight="700">Per-frame pipeline &amp; concurrency</text>
  <text x="48" y="84" fill="#9fb3ff" font-size="14">Background detached task owns capture → Vision → Core Image; only the publish step hops to the main actor. Canvas renders independently at 60 fps.</text>

  <!-- Lanes -->
  <g font-size="12" font-weight="700" letter-spacing="2">
    <rect x="48" y="110" width="1104" height="110" rx="12" fill="#0f2a3a" fill-opacity="0.7"/>
    <text x="64" y="132" fill="#00f0ff">CAMERA QUEUE (dispatch)</text>
    <rect x="48" y="232" width="1104" height="150" rx="12" fill="#16213f" fill-opacity="0.8"/>
    <text x="64" y="254" fill="#7c9bff">DETACHED LOOP TASK (userInitiated)</text>
    <rect x="48" y="394" width="1104" height="100" rx="12" fill="#2a1b3f" fill-opacity="0.8"/>
    <text x="64" y="416" fill="#ff7ff0">MAIN ACTOR</text>
  </g>

  <!-- Camera lane -->
  <g font-size="13" fill="#ffffff">
    <rect x="70" y="150" width="230" height="52" rx="10" fill="#1e3f55"/>
    <text x="84" y="172" font-weight="600">captureOutput(didOutput:)</text>
    <text x="84" y="190" fill="#bfe9ff">CMSampleBuffer → CameraFrame</text>
    <rect x="330" y="150" width="260" height="52" rx="10" fill="#1e3f55"/>
    <text x="344" y="172" font-weight="600">AsyncStream.yield</text>
    <text x="344" y="190" fill="#bfe9ff">bufferingNewest(1): late frames dropped</text>
    <text x="620" y="182" fill="#bfe9ff">30 fps in · consumer takes what it can (measured 11–21 fps analyzed)</text>
  </g>
  <line x1="300" y1="176" x2="330" y2="176" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="202" x2="460" y2="268" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop lane -->
  <g font-size="13" fill="#ffffff">
    <rect x="70" y="270" width="150" height="96" rx="10" fill="#23345f"/>
    <text x="84" y="292" font-weight="600">frameSettings()</text>
    <text x="84" y="310" fill="#d8e2ff">hop to main, read</text>
    <text x="84" y="326" fill="#d8e2ff">config · preset ·</text>
    <text x="84" y="342" fill="#d8e2ff">kaleido · frozen</text>

    <rect x="250" y="270" width="330" height="96" rx="10" fill="#23345f"/>
    <text x="264" y="292" font-weight="600">VisionPipeline.analyze  (async let ×5)</text>
    <text x="264" y="312" fill="#d8e2ff">hands ∥ body ∥ [segmentation→contours] ∥ face ∥ body3D</text>
    <text x="264" y="330" fill="#d8e2ff">heavy requests every 2nd frame, cached in between</text>
    <text x="264" y="350" fill="#9fb3ff">→ FrameAnalysis (view-normalized points, mask, polygons)</text>

    <rect x="610" y="270" width="200" height="96" rx="10" fill="#23345f"/>
    <text x="624" y="292" font-weight="600">GestureRecognizer</text>
    <text x="624" y="312" fill="#d8e2ff">features → classify</text>
    <text x="624" y="330" fill="#d8e2ff">hysteresis · swipes · wave</text>
    <text x="624" y="348" fill="#d8e2ff">two-hand spread/squeeze/clap</text>

    <rect x="840" y="270" width="290" height="96" rx="10" fill="#23345f"/>
    <text x="854" y="292" font-weight="600">FrameProcessor.render</text>
    <text x="854" y="312" fill="#d8e2ff">mirror → bump per palm → kaleidoscope</text>
    <text x="854" y="330" fill="#d8e2ff">CIContext(Metal) → CGImage 1280×720</text>
    <text x="854" y="348" fill="#9fb3ff">skipped while frozen</text>
  </g>
  <line x1="220" y1="318" x2="250" y2="318" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="318" x2="610" y2="318" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="318" x2="840" y2="318" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="366" x2="985" y2="430" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145" y1="394" x2="145" y2="366" stroke="#9fb3ff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Main lane -->
  <g font-size="13" fill="#ffffff">
    <rect x="70" y="432" width="300" height="50" rx="10" fill="#3a2a55"/>
    <text x="84" y="453" font-weight="600">AppModel (@Observable) settings</text>
    <text x="84" y="471" fill="#f0c4ff">VisionConfig · EffectPreset · MeshRigSettings</text>

    <rect x="400" y="432" width="300" height="50" rx="10" fill="#3a2a55"/>
    <text x="414" y="453" font-weight="600">TimelineView(.animation) + Canvas</text>
    <text x="414" y="471" fill="#f0c4ff">EffectEngine.step → StageRenderer.drawAll (60 fps)</text>

    <rect x="730" y="432" width="400" height="50" rx="10" fill="#3a2a55"/>
    <text x="744" y="453" font-weight="600">publish(analysis, gestures, image)</text>
    <text x="744" y="471" fill="#f0c4ff">frameImage · analysis · handStates · events → engine.handle / preset actions</text>
  </g>
  <line x1="730" y1="457" x2="700" y2="457" stroke="#9fb3ff" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
